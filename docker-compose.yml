
services:
    server:
        build:
            context: ./backend
        restart: unless-stopped
        ports:
            - "${API_PORT}:8000"
        volumes:
            - ./backend:/app
        environment: &app-env
            API_PORT: ${API_PORT}

            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD_FILE: ${DB_PASSWORD_FILE}

            REDIS_PORT: ${REDIS_PORT}
            REDIS_URL: ${REDIS_URL}

            OLLAMA_URL: ${OLLAMA_URL}
            OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL}
            OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}

            OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE}
            OLLAMA_TOP_K: ${OLLAMA_TOP_K}
            OLLAMA_TOP_P: ${OLLAMA_TOP_P}
            OLLAMA_REPEAT_PENALTY: ${OLLAMA_REPEAT_PENALTY}
            OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX}

            WATCHFILES_FORCE_POLLING: "true"

            NUMBA_DISABLE_JIT: "1"
            NUMBA_CACHE_DIR: /tmp/numba_cache
        secrets:
            - db-password
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command: >
            sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    db:
        image: pgvector/pgvector:pg16
        restart: unless-stopped
        user: postgres
        secrets:
            - db-password
        volumes:
            - db-data:/var/lib/postgresql
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD_FILE: ${DB_PASSWORD_FILE}
        ports:
            - "${DB_PORT}:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "${REDIS_PORT}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
    celery:
        build:
            context: ./backend
        restart: unless-stopped
        command: celery -A app.workers.tasks worker --loglevel=info
        volumes:
            - ./backend:/app
        environment:
            <<: *app-env
        secrets:
            - db-password
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        extra_hosts:
            - "host.docker.internal:host-gateway"
    pgadmin:
        image: dpage/pgadmin4:9
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
        ports:
            - "${PGADMIN_PORT}:80"
        depends_on:
            - db
volumes:
    db-data:
secrets:
    db-password:
        file: ./backend/app/db/password.txt
